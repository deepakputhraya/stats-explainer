<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Experiment Lab</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="apple-touch-icon" href="assets/favicon.png">
<style>
  /* ========================================================================
     Theme: "The Evolution of Trust" by ncase.me
     — Patrick Hand font, white paper, hand-drawn buttons, ink colors
     ======================================================================== */

  @font-face{
    font-family:'FuturaHandwritten';
    font-style:normal;
    src:url('assets/fonts/FuturaHandwritten.ttf') format('truetype');
  }

  :root{
    /* ncase/trust palette */
    --bg:#ffffff;
    --panel:#ffffff;
    --paper:#ffffff;
    --ink:#333333;
    --muted:#888888;
    --control:#4089DD;       /* ncase blue (tft) */
    --treatment:#f6b24c;      /* ncase orange (prober) */
    --good:#86C448;           /* ncase green (pavlov) */
    --warn:#FF5E5E;           /* ncase red (random) */
    --accent:#4089DD;         /* ncase blue */
    --line:#dddddd;
    --soft:#f5f5f5;
    --footer-bg:#222222;
    --gold:#efc701;
    --pink:#FF75FF;
    --purple:#52537F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;width:100%;}
  body{
    font-family:'FuturaHandwritten','Comic Sans MS',cursive;
    background:var(--bg);
    color:var(--ink);
    font-size:24px;
    padding:0;
  }

  /* fake bold — ncase trick */
  b,strong{font-weight:normal;text-shadow:1px 0 0 currentColor;}

  /* ---------- HUD ---------- */
  .ex-hud{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:10px 16px;background:var(--footer-bg);
    position:sticky;top:0;z-index:50;
  }
  .ex-hud__left{display:flex;align-items:center;gap:14px;min-width:0;}
  .ex-hud__brand{display:flex;align-items:center;gap:8px;}
  .ex-hud__logo{font-size:24px;line-height:1;}
  .ex-hud__title{font-size:24px;color:#fff;letter-spacing:.3px;}
  .ex-hud__meta{display:flex;flex-direction:column;line-height:1.25;min-width:0;}
  .ex-hud__mission{font-size:22px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ex-hud__objective{font-size:18px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .ex-hud__actions{display:flex;gap:6px;flex:0 0 auto;}

  
  /* ---------- shared buttons (hand-drawn ncase style, CSS-only) ---------- */
  .ex-btn{
    display:inline-flex;align-items:center;justify-content:center;
    padding:10px 24px;border:2px solid var(--ink);border-radius:8px;
    font-family:'FuturaHandwritten',cursive;font-size:22px;
    cursor:pointer;background:var(--panel);color:var(--ink);
    transition:transform .1s ease-out, background .15s, box-shadow .15s;
    line-height:1.2;
  }
  .ex-btn:hover{transform:translateY(-2px);box-shadow:0 3px 0 var(--ink);background:#f5f5f5;}
  .ex-btn:active{transform:translateY(0);box-shadow:0 0 0 var(--ink);}
  .ex-btn--primary{background:var(--accent);color:#fff;border-color:var(--accent);font-size:24px;font-weight:normal;text-shadow:none;}
  .ex-btn--primary:hover{background:#2f6fc4;box-shadow:0 3px 0 #2a5f9e;}
  .ex-btn--ghost{background:transparent;border-color:transparent;font-size:20px;padding:6px 14px;color:var(--ink);}
  .ex-btn--ghost:hover{border-color:transparent;text-decoration:underline;box-shadow:none;transform:none;background:#f5f5f5;}
  /* HUD + overlay headers have dark backgrounds — ghost buttons there must be white */
  .ex-hud .ex-btn--ghost,.ex-overlay__header .ex-btn--ghost{color:#fff;}
  .ex-hud .ex-btn--ghost:hover,.ex-overlay__header .ex-btn--ghost:hover{background:rgba(255,255,255,.15);}
  .ex-btn--warn{background:var(--warn);color:#fff;border-color:var(--warn);font-size:20px;}
  .ex-btn--warn:hover{background:#e04a4a;box-shadow:0 3px 0 #b03a3a;}
  .ex-btn--choice{
    display:block;width:100%;text-align:left;
    padding:16px 20px;margin-bottom:10px;
    background:var(--panel);border:2px dashed var(--ink);border-radius:8px;
    font-size:22px;color:var(--ink);
    font-family:'FuturaHandwritten',cursive;cursor:pointer;
    transition:border-color .15s, background .15s, transform .1s;
  }
  .ex-btn--choice:hover{border-style:solid;transform:translateY(-1px);}
  .ex-btn--selected{border-color:var(--accent);border-style:solid;background:#eef4ff;}
  .ex-btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none;}

  /* ---------- stage (scene content) ---------- */
  #app{max-width:960px;width:100%;margin:0 auto;padding:12px 12px 24px;display:flex;flex-direction:column;min-height:calc(100vh - 50px);}
  #sceneProgress{display:flex;gap:8px;justify-content:center;margin:10px 0;}
  .dot{
    width:14px;height:14px;border-radius:50%;
    border:2px solid var(--ink);background:transparent;
    transition:background .25s, transform .25s;
  }
  .dot.active{background:var(--accent);transform:scale(1.2);}
  .dot.done{background:var(--good);}
  .legend{display:flex;gap:18px;flex-wrap:wrap;font-size:20px;color:var(--muted);align-items:center;padding:6px 4px;margin-bottom:8px;}
  .legend span{display:inline-flex;align-items:baseline;gap:6px;}
  .legend b{color:var(--ink);}
  .swatch{width:14px;height:14px;border-radius:50%;display:inline-block;position:relative;top:1px;flex-shrink:0;}
  #stage{
    background:var(--panel);border:2px solid var(--ink);
    padding:10px;border-radius:4px;
  }
  canvas{
    display:block;width:100%;max-width:880px;height:auto;
    background:var(--paper);margin:0 auto;border-radius:2px;
  }
  #narrative{padding:16px 8px 2px;min-height:96px;}
  #narrative h2{margin:0 0 8px;font-size:28px;letter-spacing:.3px;}
  #narrative p{margin:0;color:var(--ink);line-height:1.5;font-size:22px;}
  #controls{display:flex;flex-wrap:wrap;gap:12px;padding:12px 8px;min-height:20px;align-items:center;}
  button.ctrl-btn{
    padding:10px 24px;border:2px solid var(--ink);border-radius:8px;font-size:22px;
    cursor:pointer;background:var(--panel);color:var(--ink);
    font-family:'FuturaHandwritten',cursive;
    transition:transform .1s ease-out, background .15s, box-shadow .15s;
    line-height:1.2;
  }
  button.ctrl-btn:hover{transform:translateY(-2px);box-shadow:0 3px 0 var(--ink);background:#f5f5f5;}
  button.ctrl-btn:active{transform:translateY(0);box-shadow:0 0 0 var(--ink);}
  button.ctrl-btn.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-size:24px;}
  button.ctrl-btn.primary:hover{background:#2f6fc4;box-shadow:0 3px 0 #2a5f9e;}
  button.ctrl-btn.control-color{background:var(--control);color:#fff;border-color:var(--control);}
  button.ctrl-btn.treatment-color{background:var(--treatment);color:#fff;border-color:var(--treatment);}
  button.ctrl-btn.selected{box-shadow:inset 0 0 0 3px rgba(0,0,0,0.25);text-decoration:underline;}
  button.ctrl-btn:disabled{opacity:.4;cursor:default;transform:none;box-shadow:none;}
  button.ctrl-btn.full{flex:0 0 100%;margin-top:4px;}
  .ctrl-note{font-size:20px;color:var(--muted);}
  #navButtons{display:flex;justify-content:space-between;padding:8px 8px 0;margin-top:auto;}
  #navButtons button{
    padding:6px 16px;border:1px solid var(--muted);border-radius:6px;font-size:16px;cursor:pointer;
    font-family:'FuturaHandwritten',cursive;
    transition:transform .1s ease-out, background .15s;
    line-height:1.2;
    opacity:.7;
  }
  #navButtons button:hover{opacity:1;transform:translateY(-1px);}
  #navButtons button:active{transform:translateY(0);}
  #backBtn{background:transparent;color:var(--muted);}
  #continueBtn{background:transparent;color:var(--muted);border-color:var(--muted);}
  #continueBtn:hover{color:var(--ink);border-color:var(--ink);}
  #continueBtn:disabled{opacity:.3;cursor:default;transform:none;}
  /* ---------- overlays (map / notebook / settings / freelab) ---------- */
  .ex-overlay{
    position:fixed;inset:0;z-index:100;
    background:rgba(34,34,34,.85);
    backdrop-filter:blur(4px);
    padding:24px 12px;overflow-y:auto;
    opacity:0;visibility:hidden;
    transition:opacity .22s ease, visibility .22s ease;
  }
  .ex-overlay.open{opacity:1;visibility:visible;}
  .ex-overlay__header{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    max-width:760px;margin:0 auto 14px;
  }
  .ex-overlay__title{margin:0;font-size:32px;color:#fff;}
  .ex-overlay__header .ex-btn{flex:0 0 auto;color:#fff;}
  .ex-overlay__header .ex-btn--ghost{color:#fff;border-color:#fff;}
  .ex-overlay__header .ex-btn--ghost:hover{border-color:#fff;text-decoration:underline;}
  .ex-map{max-width:760px;margin:0 auto;}
  .ex-district{margin-bottom:22px;}
  .ex-district__head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;}
  .ex-district__name{margin:0;font-size:24px;color:#fff;}
  .ex-district__tag{font-size:20px;color:#aaa;}
  .ex-path{display:flex;flex-direction:column;gap:10px;}
  .ex-node{
    background:#fff;padding:14px 16px;
    border:2px solid var(--ink);border-radius:8px;
    transition:transform .1s, border-color .15s, box-shadow .15s;
    box-shadow:0 2px 8px rgba(0,0,0,.15);
  }
  .ex-node[tabindex="0"]:hover,.ex-node[tabindex="0"]:focus{
    transform:translateY(-2px);border-color:var(--accent);outline:none;
    box-shadow:0 4px 16px rgba(0,0,0,.25);
  }
  .ex-node--locked{opacity:.5;}
  .ex-node--complete{border-color:var(--good);}
  .ex-node--next{border-color:var(--accent);box-shadow:0 0 0 3px rgba(64,137,221,.25);}
  .ex-node__head{display:flex;align-items:center;gap:10px;}
  .ex-node__state{font-size:24px;width:28px;text-align:center;}
  .ex-node__title{margin:0;font-size:24px;color:var(--ink);}
  .ex-node__body{margin:8px 0 0;font-size:20px;color:var(--muted);}
  .ex-node__objective{color:var(--ink);}
  .ex-node__time{margin-top:2px;}
  .ex-node__prereqs{margin-top:2px;font-style:italic;}
  .ex-node__unlock{margin-top:6px;color:var(--good);}
  .ex-node__unlock-icon{margin-right:4px;}
  .ex-node__cta{margin-top:10px;font-size:22px;color:var(--accent);}

  .ex-notebook{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:12px;}
  .ex-notebook__empty{padding:24px;text-align:center;color:#aaa;font-size:24px;}
  .ex-card{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .ex-card--tool{border-left:4px solid var(--accent);}
  .ex-card__title{margin:0 0 8px;font-size:24px;color:var(--ink);}
  .ex-card__body p{margin:6px 0;font-size:20px;line-height:1.5;color:var(--ink);}
  .ex-card__footer{margin-top:10px;}

  .ex-settings{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px;background:#fff;border:2px solid var(--ink);border-radius:8px;padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .ex-settings__row{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:22px;color:var(--ink);}

  .ex-freelab{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px;background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .ex-freelab button{margin-bottom:4px;}

  /* ---------- mission shell surface ---------- */
  .ex-surface{
    position:fixed;inset:0;z-index:90;
    background:rgba(255,255,255,.98);
    padding:20px 16px;overflow-y:auto;
    opacity:0;visibility:hidden;
    transition:opacity .26s ease, visibility .26s ease;
  }
  .ex-surface.open{opacity:1;visibility:visible;}
  @keyframes ex-fade-in{from{opacity:0;}to{opacity:1;}}
  @keyframes ex-fade-up{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .ex-fade{animation:ex-fade-in .22s ease both;}
  .ex-fade-up{animation:ex-fade-up .28s ease both;}
  .ex-surface__title{max-width:640px;margin:0 auto 10px;font-size:28px;text-align:center;}
  .ex-surface__body{max-width:640px;margin:0 auto;}
  .ex-surface__footer{max-width:640px;margin:14px auto 0;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
  .ex-surface__meta{display:flex;justify-content:center;gap:10px;margin-bottom:8px;color:var(--muted);font-size:18px;}
  .ex-surface__briefing{font-size:22px;line-height:1.45;text-align:center;max-width:560px;margin:0 auto;}
  .ex-surface__prompt{font-size:22px;text-align:center;margin-bottom:4px;}
  .ex-surface__hint{font-size:18px;color:var(--muted);text-align:center;margin-bottom:10px;}
  .ex-choices{max-width:560px;margin:0 auto;}
  .ex-debrief__headline{font-size:24px;text-align:center;}
  .ex-debrief__explain{font-size:19px;line-height:1.5;text-align:center;margin-top:10px;}
  .ex-debrief__term,.ex-debrief__rule{font-size:24px;text-align:center;margin-top:10px;}
  .ex-unlock{display:flex;align-items:flex-start;gap:12px;justify-content:center;margin:14px 0;}
  .ex-unlock__icon{font-size:32px;}
  .ex-unlock__name{margin:0;font-size:24px;}
  .ex-challenge{display:inline-flex;align-items:center;gap:8px;font-size:18px;color:var(--muted);background:var(--soft);padding:6px 12px;border-radius:4px;}
  .ex-challenge__icon{color:var(--accent);}
  .ex-challenge__done{color:var(--good);}

  @media (max-width:600px){
    .ex-hud__title{display:none;}
    #narrative h2{font-size:24px;}
    #narrative p{font-size:20px;}
    button.ctrl-btn{font-size:20px;padding:6px 14px;}
    .ex-surface__title{font-size:24px;}
    .ex-node{padding:12px;}
    body{font-size:22px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important;}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sceneProgress"></div>
  <div class="legend" id="legend"></div>
  <div id="stage">
    <canvas id="canvas"></canvas>
  </div>
  <div id="narrative">
    <h2 id="sceneTitle"></h2>
    <p id="sceneText"></p>
  </div>
  <div id="controls"></div>
  <div id="navButtons">
    <button id="backBtn">&larr; Back</button>
    <button id="continueBtn">Continue &rarr;</button>
  </div>
</div>

<script src="engine.js"></script>
<script src="app/ui.js"></script>
<script src="app/accessibility.js"></script>
<script src="app/progress.js"></script>
<script src="app/campaign.js"></script>
<script src="app/scene-objects.js"></script>
<script src="app/hud.js"></script>
<script src="app/map.js"></script>
<script src="app/notebook.js"></script>
<script src="app/challenge.js"></script>
<script src="app/mission-shell.js"></script>
<script src="app/freelab.js"></script>
<script src="chapters/00-what-is-an-experiment.js"></script>
<script src="chapters/01-cuped.js"></script>
<script src="chapters/02-variance-reduction.js"></script>
<script src="chapters/03-signal-vs-noise.js"></script>
<script src="chapters/04-peeking.js"></script>
<script src="chapters/05-multiple-testing.js"></script>
<script src="chapters/06-aa-tests.js"></script>
<script src="chapters/07-switchback.js"></script>
<script src="chapters/08-bandits.js"></script>
<script src="chapters/09-bayesian.js"></script>
<script src="chapters/10-holdout.js"></script>
<script src="chapters/final-lab.js"></script>
<script src="chapters/real-world-quiz.js"></script>
<script>
  bootCampaign();
</script>
</body>
</html>
